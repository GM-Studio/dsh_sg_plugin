name: CI

on:
  push:
    branches: [main, master, feat/v3-mvp]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: review-and-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Review and format-check changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/quality-gate.mjs --stage=ci --base="$BASE_SHA"

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node-version: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run pack:check
