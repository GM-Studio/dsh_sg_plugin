name: Java Vue template acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/v4/java-*.js'
      - 'src/v4/verify-evidence.js'
      - 'src/v4/provision.js'
      - 'src/v4/mirrors.js'
      - 'assets/java-vue/**'
      - 'scripts/verify-java-template.mjs'
      - '.github/workflows/java-template.yml'

permissions:
  contents: read

jobs:
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        preset: [jdk8-boot2.7, jdk17-boot3.5, jdk21-boot3.5, jdk21-boot4.0]
        include:
          - preset: jdk8-boot2.7
            java: '8'
          - preset: jdk17-boot3.5
            java: '17'
          - preset: jdk21-boot3.5
            java: '21'
          - preset: jdk21-boot4.0
            java: '21'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: src/v4/java-fullstack-template.js
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/verify-java-template.mjs ${{ matrix.preset }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: template-${{ matrix.os }}-${{ matrix.preset }}
          include-hidden-files: true
          path: |
            .specgate/template-qa/**/results.json
            .specgate/template-qa/**/.specgate/verify-runs/**
