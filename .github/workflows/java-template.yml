name: Java Vue template acceptance

on:
  workflow_dispatch:
    inputs:
      include_linux:
        description: 'Run deferred Linux acceptance'
        type: boolean
        default: false
  push:
    branches: [sg-java]
  pull_request:
    paths:
      - 'src/v4/**'
      - 'src/v3/template-*.js'
      - 'src/v4/coverage-evidence.js'
      - 'src/v4/verify-evidence.js'
      - 'src/v4/provision.js'
      - 'src/v4/mirrors.js'
      - 'assets/java-vue/**'
      - 'assets/scaffold/java/**'
      - 'test/fixtures/reference-note/**'
      - 'src/v3/**'
      - 'scripts/quality-*.mjs'
      - 'scripts/git-hooks/**'
      - 'scripts/install-hooks.mjs'
      - 'package*.json'
      - 'eslint.config.js'
      - '.prettier*'
      - 'scripts/verify-java-template.mjs'
      - '.github/workflows/java-template.yml'

permissions:
  contents: read

jobs:
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.include_linux && '["windows-latest","ubuntu-latest"]' || '["windows-latest"]') }}
        preset: [jdk8-boot2.7, jdk17-boot3.5, jdk21-boot3.5, jdk21-boot4.0]
        include:
          - preset: jdk8-boot2.7
            java: '8'
          - preset: jdk17-boot3.5
            java: '17'
          - preset: jdk21-boot3.5
            java: '21'
          - preset: jdk21-boot4.0
            java: '21'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: assets/java-vue/template/backend/pom.xml.tpl
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/verify-java-template.mjs ${{ matrix.preset }}
        env:
          SG_QUALITY_REPOSITORY: ${{ github.workspace }}
      - name: Reference and legacy Java code assets
        if: matrix.os == 'windows-latest' && matrix.preset == 'jdk8-boot2.7'
        run: node scripts/quality-assets.mjs test/fixtures/reference-note/NoteApiTest.java.tpl assets/scaffold/java/ItemController.java
        env:
          SG_QUALITY_REPOSITORY: ${{ github.workspace }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: template-${{ matrix.os }}-${{ matrix.preset }}
          include-hidden-files: true
          path: |
            .specgate/template-qa/**/results.json
            .specgate/template-qa/**/.specgate/verify-runs/**
            .specgate/reference-check-*/.specgate/**
            .specgate/scaffold-check-*/target/surefire-reports/**
            .specgate/scaffold-check-*/.specgate/quality-logs/**
